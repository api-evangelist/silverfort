aid: silverfort
name: Silverfort
description: 'Silverfort is an identity security platform that protects human and
  non-human identities across hybrid environments — on-premises, cloud, and legacy —
  without agents, proxies, or changes to existing infrastructure. Its Runtime Access
  Protection (RAP) technology integrates inline with existing IAM infrastructure
  (Active Directory, Entra ID, Okta, Ping, AWS) and evaluates every authentication
  attempt in real time before access is granted, extending MFA, identity threat
  detection and response (ITDR), identity security posture management (ISPM),
  privileged access security, service-account and non-human-identity governance, and
  AI agent security to resources that traditional identity tooling cannot reach.
  Founded in 2016 and headquartered in Dallas, Texas, Silverfort exposes a REST API
  (the "Raven" service at raven.silverfort.io, with EU and Singapore regional hosts)
  covering user and resource risk, service-account inventory and insights, policies
  and enrollment — but the REST API reference is published only inside a
  customer-authenticated knowledge base, so no public machine-readable contract is
  available.'
