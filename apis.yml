apis:
- aid: silverfort:silverfort-rest-api
  name: Silverfort REST API
  description: 'The Silverfort REST API (internally the "Raven" service) exposes user
    and resource risk read and write, service-account inventory and insights, policy
    control, and enrollment. Access is controlled by category-scoped API keys issued
    from the Silverfort Admin Console under Settings > Silverfort API (an External
    API Key, plus App User ID / App User Secret pairs for the Enrollment, Operations
    and Risk API key categories). The reference is published only inside the
    customer-only Document360 knowledge base; no OpenAPI, Swagger, GraphQL SDL or
    public Postman collection is published.'
  humanURL: https://docs.silverfort.com/product-documentation/docs/en/silverfort-rest-api-reference50-1
  baseURL: https://raven.silverfort.io
